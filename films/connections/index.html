<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>관련성 추적망 개념 영상</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
/* 「잎새·물방울의 탐구 노트」 공통 모습 (films/SPEC.md). build.mjs가 각 편 index.html에 넣는다. */
@font-face{font-family:'NanumSquareNeo';src:url('assets/fonts/NanumSquareNeoTTF-bRg.woff2') format('woff2');font-style:normal;font-weight:400;font-display:block}
@font-face{font-family:'NanumSquareNeo';src:url('assets/fonts/NanumSquareNeoTTF-cBd.woff2') format('woff2');font-style:normal;font-weight:700;font-display:block}
:root{--paper:#FBF8F3;--grid:#D9E8DF;--ink:#173F42;--green:#1E665B;--mint:#BAD7B2;--amber:#C9821C;--amber-soft:#FFF3D6;--water:#61ADCA;--rust:#C2703F;--shadow:0 10px 18px rgba(23,63,66,.16)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'NanumSquareNeo',sans-serif;color:var(--ink);letter-spacing:0;background:var(--paper)}
.paper{position:absolute;inset:0;background:var(--paper)}
.paper::before{content:'';position:absolute;inset:0;opacity:.55;background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:60px 60px}
.paper::after{content:'';position:absolute;top:0;bottom:0;left:72px;width:3px;background:#E9C9B5;opacity:.8}
.head{position:absolute;left:110px;top:54px;font-size:40px;line-height:1.2;white-space:nowrap;color:var(--green)}
.head small{font-size:32px;color:var(--ink);opacity:.75}
.stage{position:absolute;left:110px;top:300px;width:1300px;height:690px}
.zoom{position:absolute;inset:0}
.cast{position:absolute;left:1470px;top:640px;width:370px;height:342px}
.cast img{position:absolute;left:0;bottom:0;width:100%;height:auto;opacity:0}
.cast img.on{opacity:1}
.bubble{position:absolute;right:110px;top:150px;max-width:1240px;background:#fff;border:5px solid var(--ink);border-radius:30px;padding:22px 40px 18px;font-size:56px;line-height:1.25;white-space:nowrap;box-shadow:var(--shadow)}
.bubble::after{content:'';position:absolute;width:40px;height:40px;background:#fff;border-right:5px solid var(--ink);border-bottom:5px solid var(--ink);right:150px;bottom:-25px;transform:rotate(45deg)}
.w{display:inline-block;opacity:0}
.big{position:absolute;left:110px;top:150px;font-size:72px;line-height:1.2;white-space:nowrap;color:var(--ink)}
.big .w{color:#9DB3AA}
.big .key{font-style:normal;color:#C9D6D0}
.pic{position:absolute;border-radius:24px;overflow:hidden;border:5px solid #fff;box-shadow:var(--shadow);background:#e8efe6}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.obj{position:absolute}
.obj img{display:block;width:100%;height:auto}
.tag{position:absolute;width:0;height:0;opacity:0}
.tag .dot{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--ink);border:4px solid #fff}
.tag .lead{position:absolute;left:-2px;width:5px;background:var(--ink);border-radius:3px}
.tag.up .lead{bottom:0}
.tag.down .lead{top:0}
.tag .card{position:absolute;left:0;background:#fff;border:5px solid var(--ink);border-radius:20px;padding:10px 26px 8px;font-size:42px;line-height:1.15;white-space:nowrap;box-shadow:var(--shadow)}
.tag .card small{display:block;font-size:30px;opacity:.8}
.tag.hot .card{border-color:var(--amber);background:var(--amber-soft)}
.tag.hot .lead,.tag.hot .dot{background:var(--amber)}
.note{position:absolute;font-size:30px;color:var(--ink);opacity:.72;white-space:nowrap}
.panel{position:absolute;background:#fff;border:4px solid #C9DCCF;border-radius:28px;box-shadow:var(--shadow)}
.axis{position:absolute;height:5px;background:#8AA697;border-radius:3px}
.bar{position:absolute;bottom:0;border-radius:10px 10px 4px 4px}
.bar.old{background:var(--mint)}
.bar.new{background:var(--green)}
.bar.rust{background:var(--rust)}
.bar.blue{background:var(--water)}
.trend{position:absolute;height:0;border-top:7px dashed var(--amber);transform-origin:0 50%}
.strike{position:absolute;height:9px;background:var(--rust);border-radius:5px;transform-origin:0 50%}
.check{position:absolute;width:76px;height:76px;border-radius:50%;background:var(--green);border:5px solid #fff;box-shadow:var(--shadow)}
.check::after{content:'';position:absolute;left:21px;top:12px;width:20px;height:34px;border-right:9px solid #fff;border-bottom:9px solid #fff;transform:rotate(45deg)}
.chip{position:absolute;background:#fff;border:5px solid var(--ink);border-radius:22px;padding:16px 30px 12px;font-size:44px;line-height:1.2;white-space:nowrap;box-shadow:var(--shadow)}
.water{position:absolute;background:rgba(97,173,202,.62);border-top:7px solid #D4F2FB}
.arrow{position:absolute;height:7px;background:var(--ink);border-radius:4px;transform-origin:0 50%}
.arrow::after{content:'';position:absolute;right:-6px;top:-13px;width:24px;height:24px;border-right:7px solid var(--ink);border-top:7px solid var(--ink);transform:rotate(45deg)}
.meter{position:absolute;display:flex;gap:8px;align-items:center;font-size:30px;white-space:nowrap}
.meter i{display:block;width:22px;height:22px;border-radius:50%;background:#D8DFD3}
.meter.heat i.on{background:var(--rust)}
.meter.rain i.on{background:var(--water)}


    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080" data-fps="30">
      <div id="paper" class="clip paper" data-start="0" data-duration="15" data-track-index="0"></div>
      <div id="head" class="clip head" data-start="0" data-duration="15" data-track-index="1">물방울의 탐구 노트 <small>· 관련성 추적망</small></div>
      <div id="stage" class="clip stage" data-start="0" data-duration="15" data-track-index="2" data-layout-allow-overflow><div id="zoom" class="zoom"><div id="cn-pic" class="pic" style="left:0px;top:120px;width:560px;height:315px"><img src="assets/img/scene-cooling.webp" alt=""></div><i id="cn-a1" class="arrow" style="left:580px;top:276px;width:120px"></i><div id="cn-b" class="chip" style="left:730px;top:220px">냉방 전기를 더 써요</div><i id="cn-a2" class="arrow" style="left:915px;top:330px;width:150px"></i><div id="cn-c" class="chip" style="left:730px;top:500px">창문 닫고 알맞게 냉방</div><p id="cn-n1" class="note" style="left:20px;top:70px">활동</p><p id="cn-n2" class="note" style="left:740px;top:170px">자원 사용</p><p id="cn-n3" class="note" style="left:740px;top:450px">대응</p><div id="cn-t1" class="tag down" style="left:280px;top:435px"><i class="dot"></i><i class="lead" style="height:50px"></i><b class="card" style="top:50px">창문 연 채 냉방</b></div></div></div>
      <div id="cast" class="clip cast" data-start="0" data-duration="15" data-track-index="3"><img id="pose-ask" class="on" src="assets/img/otter-think.webp" alt="물방울"><img id="pose-react" src="assets/img/otter-cheer.webp" alt=""></div>
      <div id="bubble" class="clip bubble" data-start="0.6" data-duration="4.7" data-track-index="4"><span class="w">냉방과</span> <span class="w">기후는</span> <span class="w">어떻게</span> <span class="w">이어질까?</span></div>
      <div id="big" class="clip big" data-start="10.2" data-duration="4.8" data-track-index="5"><span class="w">활동</span> <span class="w">→</span> <span class="w"><em class="key">자원</em></span> <span class="w">→</span> <span class="w">대응으로</span> <span class="w">이어요</span></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.set('.tag.down .lead',{transformOrigin:'50% 0%'},0);tl.set('.tag.down .card',{xPercent:-50,transformOrigin:'50% 0%'},0);
      // 머리말과 캐릭터 등장(자세 바뀜은 찌그러짐 → 새 자세 → 복귀).
      tl.fromTo('#cast',{x:420,opacity:0},{x:0,opacity:1,duration:.8,ease:'expo.out'},.3);
      tl.fromTo('#cast',{scaleY:1,transformOrigin:'50% 100%'},{scaleY:.94,duration:.12,ease:'power2.in'},1.05);
      tl.to('#cast',{scaleY:1,duration:.3,ease:'back.out(1.6)'},1.17);
      // 질문(낱말씩 흐림→선명), 5초에 물러남.
      tl.fromTo('#bubble',{opacity:0,scale:.92,transformOrigin:'85% 100%'},{opacity:1,scale:1,duration:.35,ease:'back.out(1.5)'},.6);
      tl.fromTo('#bubble .w',{opacity:0,filter:'blur(6px)'},{opacity:1,filter:'blur(0px)',duration:.13,stagger:.07},.8);
      tl.to('#bubble',{opacity:0,filter:'blur(8px)',duration:.22,ease:'power3.in'},5.0);
      // 바뀌는 순간 캐릭터가 무대를 바라봄.
      tl.fromTo('#cast',{rotation:0},{rotation:-4,duration:.35,ease:'power2.out'},6.2);
      tl.to('#cast',{rotation:0,duration:.45,ease:'power2.inOut'},7.4);
tl.fromTo('#cn-pic',{"opacity":0,"scale":0.94},{opacity:1,scale:1,duration:0.5,ease:'expo.out'},1.2);tl.fromTo('#cn-n1',{"opacity":0},{opacity:1,duration:0.4,ease:'expo.out'},1.6);tl.set('#cn-t1',{opacity:1},2.8);tl.fromTo('#cn-t1 .lead',{scaleY:0},{scaleY:1,duration:.2,ease:'power2.out'},2.8);tl.fromTo('#cn-t1 .card',{opacity:0,scale:.7},{opacity:1,scale:1,duration:.3,ease:'back.out(1.6)'},2.9499999999999997);tl.fromTo('#cn-a1',{scaleX:0},{scaleX:1,duration:.5,ease:'power2.inOut'},5.3);tl.fromTo('#cn-b',{"opacity":0,"y":30},{opacity:1,y:0,duration:0.5,ease:'expo.out'},5.7);tl.fromTo('#cn-n2',{"opacity":0},{opacity:1,duration:0.4,ease:'expo.out'},5.9);tl.set('#cn-a2',{rotation:90},0);tl.fromTo('#cn-a2',{scaleX:0},{scaleX:1,duration:.5,ease:'power2.inOut'},6.8);tl.fromTo('#cn-c',{"opacity":0,"y":30},{opacity:1,y:0,duration:0.5,ease:'expo.out'},7.3);tl.fromTo('#cn-n3',{"opacity":0},{opacity:1,duration:0.4,ease:'expo.out'},7.5);tl.to('#cn-b',{borderColor:'#C9821C',backgroundColor:'#FFF3D6',duration:.3},8.3);
      tl.fromTo('#zoom',{scale:1,x:0,y:0},{scale:1.08,x:20,y:0,duration:.9,ease:'power2.inOut'},8.6);
      // 결론 한 줄(흐린 글자 → 잉크, 열쇠 낱말은 호박색) + 캐릭터 반응.
      tl.fromTo('#big .w',{color:'#C9D6D0'},{opacity:1,duration:.01,stagger:.09},10.35);
      tl.to('#big .w',{color:'#173F42',duration:.25,stagger:.09},10.45);
      tl.fromTo('#big .key',{color:'#C9D6D0'},{color:'#9A5E0C',duration:.25},10.45);
      tl.to('#cast',{scaleY:.9,duration:.12,ease:'power2.in'},10.9);
      tl.set('#pose-ask',{opacity:0},11.02);
      tl.set('#pose-react',{opacity:1},11.02);
      tl.to('#cast',{scaleY:1,y:-18,duration:.25,ease:'back.out(1.6)'},11.02);
      tl.to('#cast',{y:0,duration:.35,ease:'power2.in'},11.27);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
